[package]
name = "mantis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["io-util"] }
toml = "1.1.8"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
