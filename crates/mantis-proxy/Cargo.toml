[package]
name = "mantis-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
dirs = "7.0.0"
lru = "0.18.5"
mantis-core = { version = "0.0.0", path = "../mantis-core" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", default-features = false, features = ["net", "time", "rt-multi-thread", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["net", "time", "rt-multi-thread", "sync", "io-util", "macros"] }
